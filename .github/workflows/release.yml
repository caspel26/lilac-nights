name: Release

# Ships when you publish a GitHub release. Create it in the UI (or with
# `gh release create v1.0.2 --generate-notes`) and this packages the extension,
# pushes it to Open VSX, and attaches the .vsix to that same release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Release tag must match the version in package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $TAG does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "VERSION=$pkg" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Validate colors
        run: node .github/scripts/check-colors.mjs

      - name: Package
        run: npx --yes @vscode/vsce package --out "lilac-nights-${VERSION}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "lilac-nights-${VERSION}.vsix" -p "$OVSX_PAT"

      - name: Attach the .vsix to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "lilac-nights-${VERSION}.vsix" --clobber
